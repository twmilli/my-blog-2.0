<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..900;1,8..60,300..900&display=swap"
    />
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="highlight.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />

    <script>
      // Apply saved theme before first paint to avoid flash.
      (function () {
        try {
          var temp = localStorage.getItem("tay_themeStore");
          var parsed = temp ? JSON.parse(temp) : null;
          var name = parsed && parsed.name === "dark" ? "dark" : "light";

          document.documentElement.setAttribute("data-theme", name);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>

    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
